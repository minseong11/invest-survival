# 자동 검사 (#125)
#
# 실제 주가 CSV·모델 파일·API 키는 저장소에 없으므로, 테스트용 가상의 주가(make_fixture_data.py)로 검사한다.
# 계산이 맞는지·응답 형식이 맞는지·화면이 깨지지 않는지는 가격이 가상이어도 똑같이 확인된다.
#   python  : pytest (게임 엔진, 사후 분석, AI 서버 엔드포인트, LLM 출력 검사, 카드 규칙 일치)
#   flutter : 정적 분석 + 화면 흐름 테스트
#   backend : PostgreSQL을 띄우고 게임 서버 테스트·빌드 → 서버 2개를 실제로 실행해
#             Java↔Python 계산 일치(원 단위)와 실제 게임 흐름을 확인
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/python_simulation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/python_simulation/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest -q

  flutter:
    name: Flutter 분석·테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontEnd
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # 경고·오류가 있으면 실패. 참고(info) 수준은 Flutter 버전에 따라 달라져 실패로 보지 않는다
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  backend:
    name: 게임 서버 테스트 + Java↔Python 일치
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '1234'
          POSTGRES_DB: survivor_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/python_simulation/requirements-test.txt
      - run: pip install -r backend/python_simulation/requirements-test.txt

      - name: 테스트용 가상의 주가 만들기 (실제 주가 아님)
        run: python backend/python_simulation/tests/make_fixture_data.py backend/data

      - name: 게임 서버 빌드
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon

      # (12주차 교수님 피드백 3번) 기동 실패와 복구 — 테스트보다 먼저, 진짜 빈 DB에서 실제 서버(jar)로
      #  ① 필수 종목 CSV(원유) 하나를 빼면 원인·해결 방법과 함께 기동 중단
      #  ② 원유를 되돌려도, 채권 CSV의 게임 기간 중 4주(2008-10-06~31)가 비어 있으면 기동 중단
      #     (종목 데이터가 "있는지"만 보면 통과하는 경우 → 실제 라운드 날짜의 가격까지 검사)
      #  ③ 채권 CSV를 되돌리면 다음 단계에서 정상 기동 ("시나리오 3개 모두 통과")
      - name: 기동 실패와 복구 확인 (빈 DB)
        run: |
          set +e
          boot() {   # 서버가 스스로 멈추면 그 종료 코드, 120초 안에 안 멈추면 124
            (cd backend && timeout 120 java -jar build/libs/invest-survival-0.0.1-SNAPSHOT.jar > "$GITHUB_WORKSPACE/$1.log" 2>&1)
            echo $?
          }
          cd backend/data
          mv uso_d.csv /tmp/uso_d.csv
          cp tlt_d.csv /tmp/tlt_full.csv
          awk -F, 'NR==1 || $1 < "2008-10-06" || $1 > "2008-10-31"' /tmp/tlt_full.csv > tlt_d.csv
          cd "$GITHUB_WORKSPACE"

          echo "===== ① 빈 DB + 원유 CSV 없음 ====="
          code=$(boot boot-missing-csv)
          grep -E "\[CSV 폴더\]|필수 주가 데이터|USO: CSV 파일 없음|해결:" boot-missing-csv.log | sed 's/^.*\(ERROR\|INFO\)/\1/' | head -6
          echo "종료 코드: $code"
          [ "$code" != 0 ] && [ "$code" != 124 ] && grep -q "USO: CSV 파일 없음" boot-missing-csv.log || { echo "기동이 멈추지 않았습니다"; exit 1; }

          echo "===== ② 원유 복원, 채권 CSV 4주 공백 ====="
          mv /tmp/uso_d.csv backend/data/uso_d.csv
          code=$(boot boot-price-gap)
          grep -E "임포트 완료\] ticker=USO|시나리오 기간의 주가 데이터|TLT: 가격이" boot-price-gap.log | sed 's/^.*\(ERROR\|INFO\)/\1/' | head -6
          echo "종료 코드: $code"
          [ "$code" != 0 ] && [ "$code" != 124 ] && grep -q "TLT: 가격이 7일 넘게 빈 라운드" boot-price-gap.log || { echo "기동이 멈추지 않았습니다"; exit 1; }

          echo "===== ③ 채권 CSV 복원 → 아래 단계에서 정상 기동 확인 ====="
          cp /tmp/tlt_full.csv backend/data/tlt_d.csv

      - name: 게임 서버 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: 게임 서버(8080)·AI 서버(8000) 실행
        run: |
          cd backend
          nohup java -jar build/libs/invest-survival-0.0.1-SNAPSHOT.jar > "$GITHUB_WORKSPACE/spring.log" 2>&1 &
          cd python_simulation
          nohup python fastapi_server.py > "$GITHUB_WORKSPACE/fastapi.log" 2>&1 &
          for i in $(seq 1 90); do
            if grep -q "시나리오 3개 모두 통과" "$GITHUB_WORKSPACE/spring.log" 2>/dev/null \
               && curl -sf localhost:8080/game/scenarios > /dev/null \
               && curl -sf localhost:8000/ > /dev/null; then
              echo "서버 준비 완료"; exit 0
            fi
            sleep 2
          done
          echo "서버가 시간 안에 준비되지 않았습니다"; exit 1

      - name: Java↔Python 계산 일치 확인 (차이가 1원이라도 있으면 실패)
        working-directory: backend/python_simulation
        run: python compare_java_python.py --n 150 --strict --no-report

      - name: 실제 게임 흐름 확인 (시작 → 카드·위기 대응 → 사후 분석)
        working-directory: backend/python_simulation
        run: python e2e_game_flow.py --games 2

      - name: 서버 로그 (실패했을 때)
        if: failure()
        run: |
          echo "===== boot-missing-csv.log ====="; tail -n 40 "$GITHUB_WORKSPACE/boot-missing-csv.log" || true
          echo "===== boot-price-gap.log ====="; tail -n 40 "$GITHUB_WORKSPACE/boot-price-gap.log" || true
          echo "===== spring.log ====="; tail -n 150 "$GITHUB_WORKSPACE/spring.log" || true
          echo "===== fastapi.log ====="; tail -n 80 "$GITHUB_WORKSPACE/fastapi.log" || true
