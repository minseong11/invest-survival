spring:
  datasource:
    # 접속 정보는 환경변수로 바꿀 수 있다 (없으면 아래 기본값) — 본인 환경에 맞춘 값을 커밋하지 않기 위해
    url: ${DB_URL:jdbc:postgresql://localhost:5432/survivor_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    # SQL 로그는 기본으로 끈다 (요청마다 수십 줄씩 찍혀 오류 로그를 찾기 어려웠음). 필요하면 SHOW_SQL=true
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

# FastAPI AI 서버 주소 (GameService의 ${ai.server.url})
# - 예전에는 jpa: 아래에 들여쓰기돼 있어서 이 값이 적용되지 않고 코드 기본값이 쓰였음
ai:
  server:
    url: http://localhost:8000

# 주가 CSV 폴더
# - 상대 경로는 서버를 실행한 폴더 기준 (backend/에서 실행하면 backend/data)
# - 다른 폴더에서 실행하면 절대 경로로 지정 (예: /Users/mg/Documents/GitHub/invest-survival/backend/data)
data:
  csv-dir: data